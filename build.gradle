plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

loom {
	accessWidenerPath = file("src/main/resources/metallum.accesswidener")
}

repositories {
	maven { url "https://api.modrinth.com/maven" }
	maven { url "https://maven.meteordev.org/releases" }
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "maven.modrinth:sodium:${project.sodium_version}"

	// Optional Meteor Client compatibility (com.metallum.mixin.meteor.*).
	// We only need Meteor's IGpuDevice interface at compile time; the mixins
	// are gated at runtime by MetallumMixinConfigPlugin, so this must never be
	// a runtime dependency. Point this at your Meteor Client build (or a
	// published artifact) with:
	//   ./gradlew -PmeteorClientJar=/path/to/meteor-client-26.2-<build>.jar build
	def meteorClientJar = providers.gradleProperty("meteorClientJar").orNull
	if (meteorClientJar != null) {
		compileOnly files(meteorClientJar)
	} else {
		compileOnly files("../meteor-client-metallum/build/libs/meteor-client-26.2-local.jar")
	}
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": inputs.properties.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	inputs.property "projectName", project.name

	from("LICENSE") {
		rename { "${it}_${project.name}"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}
